name: weread sync

on:
  workflow_dispatch:
    inputs:
      full-sync:
        description: 开启可分批恢复的全量同步
        type: boolean
        default: false
      batch-size:
        description: 全量同步每批处理的书籍数量，建议 20-30
        type: number
        default: 25
      batch-index:
        description: 全量同步批次编号，从 0 开始
        type: number
        default: 0
      max-changes:
        description: 日常增量同步每次最多写入的书籍数量
        type: number
        default: 50
      sync-year:
        description: 可选，只同步最后阅读年份，例如 2026
        type: string
        required: false
      sync-reading-stats:
        description: 同步每日阅读时长到日/周/月/年统计库
        type: boolean
        default: true
      stats-lookback-days:
        description: 每次回看并校正最近多少天的阅读统计
        type: number
        default: 14
      stats-only:
        description: 只同步阅读统计，不处理书籍
        type: boolean
        default: false
      existing-page-mode:
        description: 旧页面没有同步标记时的处理方式
        type: choice
        options:
          - append
          - preserve
        default: append
      book-id:
        description: 可选，只同步一本书的 WeRead BookId
        type: string
        required: false
  schedule:
    # GitHub Actions cron uses UTC. 18:00 UTC = 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: WeRead to Notion
        uses: ./
        with:
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-page: ${{ secrets.NOTION_PAGE }}
          notion-database-id: ${{ secrets.NOTION_DATABASE_ID }}
          notion-data-source-id: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          full-sync: ${{ inputs.full-sync || 'false' }}
          batch-size: ${{ inputs.batch-size || '25' }}
          batch-index: ${{ inputs.batch-index || '0' }}
          max-changes: ${{ inputs.max-changes || '50' }}
          sync-year: ${{ inputs.sync-year || '' }}
          sync-reading-stats: ${{ inputs.sync-reading-stats || 'true' }}
          stats-lookback-days: ${{ inputs.stats-lookback-days || '14' }}
          stats-only: ${{ inputs.stats-only || 'false' }}
          existing-page-mode: ${{ inputs.existing-page-mode || 'append' }}
          book-id: ${{ inputs.book-id || '' }}
      - name: Publish reading heatmap
        if: ${{ success() }}
        shell: bash
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [[ ! -f OUT_FOLDER/reading-heatmap.svg ]]; then
            echo "No heatmap output was generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f OUT_FOLDER/reading-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update reading heatmap"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          heatmap_commit="$(git rev-parse HEAD)"
          heatmap_image="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${heatmap_commit}/OUT_FOLDER/reading-heatmap.svg"
          heatmap_url="https://heatmap.malinkang.com/?image=${heatmap_image}"
          echo "Heatmap commit: ${heatmap_commit}"
          jq -nc --arg url "$heatmap_url" '{embed:{url:$url}}' | \
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              --url "https://api.notion.com/v1/blocks/fff7538b-60b2-817b-b70e-ee83875fff53" \
              --header "Authorization: Bearer $NOTION_TOKEN" \
              --header "Content-Type: application/json" \
              --header "Notion-Version: 2026-03-11" \
              --data-binary @-
