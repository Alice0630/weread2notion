name: weread2notion sync
description: Sync WeRead highlights and notes to Notion.
author: malinkang

inputs:
  weread-api-key:
    description: WeRead Gateway API key.
    required: true
  notion-token:
    description: Notion integration token.
    required: true
  notion-page:
    description: Notion database page URL or database ID.
    required: false
  notion-database-id:
    description: Notion database ID. Used when notion-page is not set.
    required: false
  notion-data-source-id:
    description: Notion data source ID. Preferred for Notion-Version 2026-03-11.
    required: false
  full-sync:
    description: Run a resumable full sync batch when true.
    required: false
    default: "false"
  batch-size:
    description: Number of books in each full-sync batch.
    required: false
    default: "25"
  batch-index:
    description: Zero-based full-sync batch number.
    required: false
    default: "0"
  max-changes:
    description: Maximum changed books written by a non-full sync.
    required: false
    default: "50"
  sync-year:
    description: Optional last-read year filter, for example 2026.
    required: false
  sync-reading-stats:
    description: Sync daily reading duration into the existing period databases.
    required: false
    default: "true"
  stats-lookback-days:
    description: Number of daily reading-stat records to revisit.
    required: false
    default: "14"
  stats-only:
    description: Skip books and only sync daily reading statistics.
    required: false
    default: "false"
  existing-page-mode:
    description: Preserve legacy page bodies or append a managed sync section.
    required: false
    default: append
  book-id:
    description: Optional WeRead BookId for a one-book test run.
    required: false
  notion-status-property:
    description: Notion status property name.
    required: false
    default: 阅读状态
  notion-duration-property:
    description: Notion reading duration property name.
    required: false
    default: 阅读时长
  notion-progress-property:
    description: Writable Notion percent property name.
    required: false
    default: 阅读进度
  notion-completed-date-property:
    description: Notion completed date property name.
    required: false
    default: 时间
  notion-last-read-date-property:
    description: Notion last-read date property name.
    required: false
    default: 最后阅读时间
  notion-start-read-date-property:
    description: Notion first-read date property name.
    required: false
    default: 开始阅读时间
  python-version:
    description: Python version used to run the sync.
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install weread2notion
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "$GITHUB_ACTION_PATH"
    - name: Sync WeRead to Notion
      shell: bash
      env:
        WEREAD_API_KEY: ${{ inputs.weread-api-key }}
        NOTION_TOKEN: ${{ inputs.notion-token }}
        NOTION_PAGE: ${{ inputs.notion-page }}
        NOTION_DATABASE_ID: ${{ inputs.notion-database-id }}
        NOTION_DATA_SOURCE_ID: ${{ inputs.notion-data-source-id }}
        FULL_SYNC: ${{ inputs.full-sync }}
        BATCH_SIZE: ${{ inputs.batch-size }}
        BATCH_INDEX: ${{ inputs.batch-index }}
        MAX_CHANGES_PER_RUN: ${{ inputs.max-changes }}
        SYNC_YEAR: ${{ inputs.sync-year }}
        SYNC_READING_STATS: ${{ inputs.sync-reading-stats }}
        STATS_LOOKBACK_DAYS: ${{ inputs.stats-lookback-days }}
        STATS_ONLY: ${{ inputs.stats-only }}
        NOTION_EXISTING_PAGE_MODE: ${{ inputs.existing-page-mode }}
        WEREAD_BOOK_ID: ${{ inputs.book-id }}
        NOTION_STATUS_PROPERTY: ${{ inputs.notion-status-property }}
        NOTION_DURATION_PROPERTY: ${{ inputs.notion-duration-property }}
        NOTION_PROGRESS_PROPERTY: ${{ inputs.notion-progress-property }}
        NOTION_COMPLETED_DATE_PROPERTY: ${{ inputs.notion-completed-date-property }}
        NOTION_LAST_READ_DATE_PROPERTY: ${{ inputs.notion-last-read-date-property }}
        NOTION_START_READ_DATE_PROPERTY: ${{ inputs.notion-start-read-date-property }}
      run: weread2notion sync
